<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wochenplan</title>
    <meta name="description" content="Gemeinsamer Essensplaner mit Einkaufsliste und Rezepten" />
    <meta name="theme-color" content="#13131A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wochenplan" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/dancing-script-600.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* Schrift für den Schriftzug: liegt in public/fonts und wird von der eigenen Adresse geladen, nicht von fremden Servern */
      @font-face { font-family: 'Dancing Script'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/dancing-script-600.woff2) format('woff2'); }
      /* Farben der App (dunkles Design). src/theme.js greift per var(--c-…) darauf zu. */
      :root {
        --c-bg: #1E1E24;
        --c-white: #2A2A32;
        --c-border: #3A3A46;
        --c-text: #F0EEE9;
        --c-muted: #9A9898;
        --c-subtle: #7A7A86;
        --c-accent: #D4904A;
        --c-abg: #2E2820;
        --c-dark: #13131A;
        --c-ok: #4CAF7D;
        --c-err: #E05555;
        --c-star: #E8B547;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: var(--c-dark); overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; background: var(--c-dark); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
