<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schlauesKochbuch.de</title>
    <meta name="description" content="Gemeinsamer Essensplaner mit Einkaufsliste und Rezepten" />
    <meta name="theme-color" content="#13131A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="schlauesKochbuch.de" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/dancing-script-700.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* Schrift für den Schriftzug: liegt in public/fonts und wird von der eigenen Adresse geladen, nicht von fremden Servern */
      @font-face { font-family: 'Dancing Script'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/dancing-script-700.woff2) format('woff2'); }
      @font-face { font-family: 'Dancing Script'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/dancing-script-600.woff2) format('woff2'); }
      /* Farben der App. src/theme.js greift per var(--c-…) darauf zu.
         Hell ist der Grundzustand, [data-theme="dark"] schaltet auf Dunkel (am <html> oder an einer einzelnen Ansicht). */
      :root {
        --c-bg: #F6F3EE; --c-white: #FFFEFB; --c-border: #E3DDD3; --c-text: #221E1A; --c-muted: #645C52; --c-subtle: #7A7166;
        --c-accent: #0B6466; --c-abg: #DFF0EF; --c-abg-border: #B9DAD8; --c-on-accent: #FFFFFF;
        --c-dark: #F6F3EE; --c-ok: #17714C; --c-warn: #8A5A00; --c-err: #B93434; --c-star: #B07A00;
        --c-field: #FFFFFF; --c-strong: #DFF0EF; --c-on-strong: #0B6466; --c-logo: #E3000F; --c-logo-line: #1A1A1A;
        --c-head: #FFFEFB; --c-head-muted: #645C52; --c-head-btn: #F1EDE6; --c-head-btn-border: #E3DDD3; --c-head-btn-text: #221E1A;
        --c-ok-bg: #E3F3EB; --c-ok-border: #C4E3D2; --c-err-bg: #FBE9E9; --c-err-border: #F0C4C4;
        --c-shade: #13131A;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --c-bg: #23201D; --c-white: #2E2A26; --c-border: #433D36; --c-text: #EFEAE3; --c-muted: #B5AB9E; --c-subtle: #9A9084;
        --c-accent: #62C6C0; --c-abg: #21403F; --c-abg-border: #2F5958; --c-on-accent: #06201F;
        --c-dark: #171512; --c-ok: #62C394; --c-warn: #E0B25A; --c-err: #F08585; --c-star: #E8B547;
        --c-field: #1F1C19; --c-strong: #21403F; --c-on-strong: #62C6C0; --c-logo: #FF2E3E; --c-logo-line: #000000;
        --c-head: #171512; --c-head-muted: rgba(255,255,255,0.6); --c-head-btn: rgba(255,255,255,0.06); --c-head-btn-border: rgba(255,255,255,0.12); --c-head-btn-text: rgba(255,255,255,0.8);
        --c-ok-bg: #1F3A2E; --c-ok-border: #2E5040; --c-err-bg: #40282A; --c-err-border: #6A3A3C;
        --c-shade: #171512;
        color-scheme: dark;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: var(--c-dark); overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; background: var(--c-dark); }
    </style>
    <script>
      // Design (System, Hell, Dunkel) vor dem ersten Bild setzen, damit nichts aufblitzt. Gleiche Logik wie src/themeMode.js.
      (function(){
        var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
        function apply(){
          var m = "system"; try { m = localStorage.getItem("wochenplan_theme") || "system"; } catch(e) {}
          var dark = m === "dark" || (m !== "light" && mq && mq.matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var t = document.querySelector('meta[name="theme-color"]'); if (t) t.setAttribute("content", dark ? "#171512" : "#FFFEFB");
        }
        apply();
        if (mq && mq.addEventListener) mq.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
